<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakMate — AI 英语陪练</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --primary: #3b82f6;
    --primary-light: #60a5fa;
    --accent: #22d3ee;
    --text: #f1f5f9;
    --text2: #94a3b8;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --border: #334155;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .title {
    font-size: 20px; font-weight: 700;
  }
  .title span { color: var(--accent); }
  .subtitle { font-size: 12px; color: var(--text2); }

  /* Scenario selector */
  .scenario-bar {
    background: var(--surface);
    padding: 12px 24px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .scenario-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    white-space: nowrap;
    font-size: 13px;
    transition: all 0.2s;
  }
  .scenario-btn:hover {
    border-color: var(--primary);
    color: var(--text);
  }
  .scenario-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

  .message {
    display: flex;
    gap: 12px;
    max-width: 80%;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.ai { align-self: flex-start; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .avatar.user { background: var(--primary); }
  .avatar.ai { background: var(--accent); }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
  }
  .message.user .bubble {
    background: var(--primary);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.ai .bubble {
    background: var(--surface2);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .bubble .correction {
    display: block;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
    color: var(--yellow);
  }

  .speak-btn {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-size: 11px;
    transition: all 0.2s;
  }
  .speak-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(34, 211, 238, 0.1);
  }

  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing-indicator span {
    width: 8px; height: 8px;
    background: var(--text2);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input */
  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }
  .input-area input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-area input:focus {
    border-color: var(--primary);
  }
  .input-area input::placeholder {
    color: var(--text2);
  }
  .btn {
    padding: 12px 24px;
    border-radius: 24px;
    border: none;
    background: var(--primary);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--primary-light); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
  }
  .btn-secondary:hover { background: #475569; }

  /* Mic button */
  .mic-btn {
    padding: 12px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-size: 18px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }
  .mic-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  .mic-btn.listening {
    border-color: var(--red);
    color: var(--red);
    background: rgba(239, 68, 68, 0.1);
    animation: pulse 1.5s infinite;
  }
  .mic-btn.processing {
    border-color: var(--yellow);
    color: var(--yellow);
    background: rgba(234, 179, 8, 0.1);
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }

  /* Voice input status */
  .voice-status {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--text2);
    display: none;
    align-items: center;
    gap: 8px;
    z-index: 50;
    white-space: nowrap;
  }
  .voice-status.show { display: flex; }
  .voice-status .wave {
    display: inline-flex;
    gap: 2px;
    align-items: center;
    height: 16px;
  }
  .voice-status .wave span {
    width: 3px;
    background: var(--red);
    border-radius: 2px;
    animation: wave 0.8s infinite ease-in-out;
  }
  .voice-status .wave span:nth-child(1) { height: 6px; animation-delay: 0s; }
  .voice-status .wave span:nth-child(2) { height: 12px; animation-delay: 0.1s; }
  .voice-status .wave span:nth-child(3) { height: 8px; animation-delay: 0.2s; }
  .voice-status .wave span:nth-child(4) { height: 14px; animation-delay: 0.3s; }
  .voice-status .wave span:nth-child(5) { height: 6px; animation-delay: 0.4s; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.5); }
    50% { transform: scaleY(1); }
  }

  /* Score panel */
  .score-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .score-overlay.show { display: flex; }

  .score-panel {
    background: var(--surface);
    border-radius: 20px;
    padding: 32px;
    width: 420px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
    animation: fadeIn 0.3s ease;
  }
  .score-panel h2 {
    font-size: 24px;
    margin-bottom: 20px;
    text-align: center;
  }
  .score-big {
    text-align: center;
    margin-bottom: 24px;
  }
  .score-big .number {
    font-size: 56px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .score-big .label {
    font-size: 14px;
    color: var(--text2);
  }
  .score-detail {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .score-item {
    background: var(--bg);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .score-item .val {
    font-size: 24px;
    font-weight: 700;
  }
  .score-item .lbl {
    font-size: 12px;
    color: var(--text2);
    margin-top: 4px;
  }
  .score-item .bar {
    height: 4px;
    border-radius: 2px;
    margin-top: 8px;
    background: var(--surface2);
    overflow: hidden;
  }
  .score-item .bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 1s ease;
  }
  .feedback-text {
    background: var(--bg);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text2);
  }
  .suggestions {
    margin-bottom: 20px;
  }
  .suggestions h3 {
    font-size: 14px;
    margin-bottom: 8px;
  }
  .suggestions li {
    list-style: none;
    padding: 8px 12px;
    background: var(--bg);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--text2);
  }
  .suggestions li::before {
    content: "💡 ";
  }
  .close-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
  }
  .close-btn:hover { background: var(--surface2); }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text2);
    flex-shrink: 0;
  }
  .status-bar .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-bar .dot.online { background: var(--green); }
  .status-bar .dot.offline { background: var(--red); }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    gap: 12px;
  }
  .empty-state .icon { font-size: 64px; }
  .empty-state p { font-size: 14px; text-align: center; line-height: 1.8; }

  @media (max-width: 600px) {
    .header { padding: 10px 16px; }
    .scenario-bar { padding: 10px 16px; }
    .chat-area { padding: 16px; }
    .input-area { padding: 12px 16px; }
    .message { max-width: 90%; }
    .score-panel { padding: 20px; }
    .score-detail { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="logo">🗣️</div>
    <div>
      <div class="title">Speak<span>Mate</span></div>
      <div class="subtitle">AI 英语陪练</div>
    </div>
  </div>
  <button class="btn btn-secondary" onclick="showScore()" id="scoreBtn" style="display:none;">
    📊 查看评分
  </button>
</div>

<!-- Scenario bar -->
<div class="scenario-bar" id="scenarioBar">
  <div class="typing-indicator" id="scenarioLoading">
    <span></span><span></span><span></span>
  </div>
</div>

<!-- Chat area -->
<div class="chat-area" id="chatArea">
  <div class="empty-state" id="emptyState">
    <div class="icon">🗣️</div>
    <p>
      选择一个场景，开始你的英语口语练习<br>
      AI 会实时纠正你的语法和用词错误 ✨
    </p>
  </div>
</div>

<!-- Input -->
<div class="input-area" style="position:relative;">
  <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()" title="语音输入">
    🎤
  </button>
  <input
    type="text"
    id="chatInput"
    placeholder="用英语输入你想说的话..."
    autofocus
    onkeydown="if(event.key==='Enter') sendMessage()"
  >
  <button class="btn" onclick="sendMessage()" id="sendBtn">
    ➤ 发送
  </button>
  <!-- 语音状态提示 -->
  <div class="voice-status" id="voiceStatus">
    <span>🎤 正在听...</span>
    <span class="wave">
      <span></span><span></span><span></span><span></span><span></span>
    </span>
  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <span><span class="dot online" id="statusDot"></span><span id="statusText">连接中...</span></span>
  <span>
    <button id="autoSpeakBtn" onclick="toggleAutoSpeak()" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:12px;margin-right:12px;">🔊 自动朗读</button>
    <span id="msgCount">0 条消息</span>
  </span>
</div>

<!-- Score overlay -->
<div class="score-overlay" id="scoreOverlay">
  <div class="score-panel">
    <h2>📊 对话评估</h2>
    <div class="score-big">
      <div class="number" id="overallScore">0</div>
      <div class="label">综合评分</div>
    </div>
    <div class="score-detail">
      <div class="score-item">
        <div class="val" id="fluencyScore" style="color:var(--primary)">0</div>
        <div class="lbl">流利度</div>
        <div class="bar"><div class="bar-fill" id="fluencyBar" style="width:0%;background:var(--primary)"></div></div>
      </div>
      <div class="score-item">
        <div class="val" id="grammarScore" style="color:var(--green)">0</div>
        <div class="lbl">语法</div>
        <div class="bar"><div class="bar-fill" id="grammarBar" style="width:0%;background:var(--green)"></div></div>
      </div>
      <div class="score-item">
        <div class="val" id="vocabScore" style="color:var(--yellow)">0</div>
        <div class="lbl">词汇</div>
        <div class="bar"><div class="bar-fill" id="vocabBar" style="width:0%;background:var(--yellow)"></div></div>
      </div>
    </div>
    <div class="feedback-text" id="feedbackText">暂无评估数据</div>
    <div class="suggestions">
      <h3>💡 改进建议</h3>
      <ul id="suggestionList">
        <li>开始对话后即可获得建议</li>
      </ul>
    </div>
    <button class="close-btn" onclick="closeScore()">关闭</button>
  </div>
</div>

<script>
// ─── 配置 ───
const API_BASE = 'http://127.0.0.1:3001';

const state = {
  messages: [],
  currentScenario: 'free',
  isTyping: false,
  scenarioMap: {},
};

// ─── 工具 ───
function $(id) { return document.getElementById(id); }

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function scrollToBottom() {
  const area = $('chatArea');
  area.scrollTop = area.scrollHeight;
}

// ─── 加载场景 ───
async function loadScenarios() {
  try {
    const res = await fetch(`${API_BASE}/scenarios`);
    const data = await res.json();
    const bar = $('scenarioBar');
    const loading = $('scenarioLoading');
    loading.remove();

    data.scenarios.forEach((s, i) => {
      state.scenarioMap[s.id] = s;
      const btn = document.createElement('button');
      btn.className = 'scenario-btn' + (i === 0 ? ' active' : '');
      btn.textContent = s.name;
      btn.dataset.id = s.id;
      btn.onclick = () => switchScenario(s.id);
      bar.appendChild(btn);
    });

    setStatus('connected');
  } catch (e) {
    setStatus('error');
    console.error('Failed to load scenarios:', e);
  }
}

function switchScenario(id) {
  state.currentScenario = id;
  state.messages = [];
  $('chatArea').innerHTML = '<div class="empty-state" id="emptyState"><div class="icon">🗣️</div><p>已切换到 ' + (state.scenarioMap[id]?.name || id) + '<br>开始用英语对话吧 ✨</p></div>';
  $('scoreBtn').style.display = 'none';
  $('msgCount').textContent = '0 条消息';

  document.querySelectorAll('.scenario-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
  });

  // 自动发第一条消息让 AI 开场
  addMessage('ai', getScenarioOpening(id));
}

function getScenarioOpening(scenarioId) {
  const openings = {
    'free': "Hello there! I'm SpeakMate, your English conversation partner. How are you doing today? Is there anything specific you'd like to talk about?",
    'hotel': "Good evening! Welcome to our hotel. How may I assist you today? Are you looking to check in, or do you need information about our services?",
    'interview': "Good morning, I'm Sarah from HR. Thank you for coming in today. Why don't you start by telling me a little bit about yourself?",
    'travel': "Welcome to London! I'm your local guide. What kind of places are you interested in visiting? Historical sites, museums, or maybe the best places to eat?",
    'business': "Good morning! How was your weekend? By the way, I was looking at the Q3 projections for our project and wanted to discuss some ideas with you.",
    'ielts': "Hello, I'm your IELTS speaking examiner. Let's begin with Part 1. Could you tell me about where you live? Do you live in a house or an apartment?",
  };
  return openings[scenarioId] || openings['free'];
}

// ─── 消息系统 ───
function addMessage(role, content, correction) {
  const area = $('chatArea');
  const empty = $('emptyState');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'message ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + role;
  avatar.textContent = role === 'user' ? '👤' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  // 解析修正提示和评分标记
  let displayContent = content;
  let extractedCorrection = correction || null;

  // 提取 (Correction: ...) 或 (Tip: ...) 标记
  const correctionMatch = content.match(/\(*(Correction|Tip):?\s*(.*?)\)/i);
  if (correctionMatch && !correction) {
    extractedCorrection = correctionMatch[2];
    displayContent = content.replace(correctionMatch[0], '');
  }

  // 提取 [Rating: ...] 评分标记
  const ratingMatch = displayContent.match(/\[Rating:\s*(\d+)\/10\s*-\s*(.*?)\]/);
  if (ratingMatch) {
    displayContent = displayContent.replace(ratingMatch[0], '');
  }

  // 显示主内容
  const contentDiv = document.createElement('div');
  contentDiv.innerHTML = escapeHtml(displayContent.trim()).replace(/\n/g, '<br>');
  bubble.appendChild(contentDiv);

  // 评分标签
  if (ratingMatch) {
    const ratingTag = document.createElement('span');
    ratingTag.style.cssText = 'display:inline-block;margin-top:8px;padding:3px 10px;border-radius:10px;background:rgba(34,211,238,0.15);color:#22d3ee;font-size:12px;font-weight:600;';
    ratingTag.textContent = `⭐ ${ratingMatch[1]}/10 — ${ratingMatch[2]}`;
    bubble.appendChild(ratingTag);
  }

  // 修正标签
  if (extractedCorrection) {
    const corr = document.createElement('span');
    corr.className = 'correction';
    corr.textContent = '💡 ' + extractedCorrection.trim();
    bubble.appendChild(corr);
  }

  // AI 消息加朗读按钮
  if (role === 'ai') {
    const speakBtn = document.createElement('button');
    speakBtn.className = 'speak-btn';
    speakBtn.textContent = '🔊 朗读';
    speakBtn.onclick = () => speakText(displayContent.trim());
    bubble.appendChild(speakBtn);
  }

  div.appendChild(role === 'user' ? bubble : avatar);
  div.appendChild(role === 'user' ? avatar : bubble);
  area.appendChild(div);
  scrollToBottom();

  state.messages.push({ role, content });
  $('msgCount').textContent = state.messages.filter(m => m.role === 'user').length + ' 条消息';
}

function showTyping() {
  const area = $('chatArea');
  $('emptyState')?.remove();

  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="avatar ai">🤖</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  area.appendChild(div);
  scrollToBottom();
  state.isTyping = true;
  $('sendBtn').disabled = true;
}

function hideTyping() {
  const el = $('typingIndicator');
  if (el) el.remove();
  state.isTyping = false;
  $('sendBtn').disabled = false;
}

// ─── 发送消息 ───
async function sendMessage() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text || state.isTyping) return;

  input.value = '';
  addMessage('user', text);
  showTyping();

  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: state.messages.slice(-20),
        mode: 'scenario',
        scenario: state.currentScenario,
      }),
    });
    const data = await res.json();
    hideTyping();
    addMessage('ai', data.reply, data.correction);
    $('scoreBtn').style.display = 'inline-flex';

    // 自动朗读 AI 回复
    if (autoSpeak && data.reply) {
      setTimeout(() => speakText(data.reply), 300);
    }
  } catch (e) {
    hideTyping();
    addMessage('ai', 'Sorry, there was an error connecting to the server. Please make sure the backend is running.');
    console.error(e);
  }
}

// ─── 评分 ───
async function showScore() {
  if (state.messages.length < 2) return;

  const overlay = $('scoreOverlay');
  overlay.classList.add('show');

  try {
    const res = await fetch(`${API_BASE}/evaluate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: state.messages,
        scenario: state.currentScenario,
      }),
    });
    const data = await res.json();

    $('overallScore').textContent = Math.round(data.score || 0);
    $('fluencyScore').textContent = Math.round(data.fluency || 0);
    $('grammarScore').textContent = Math.round(data.grammar || 0);
    $('vocabScore').textContent = Math.round(data.vocabulary || 0);

    $('fluencyBar').style.width = (data.fluency || 0) + '%';
    $('grammarBar').style.width = (data.grammar || 0) + '%';
    $('vocabBar').style.width = (data.vocabulary || 0) + '%';

    $('feedbackText').textContent = data.feedback || '暂无评估数据';

    const list = $('suggestionList');
    list.innerHTML = '';
    (data.suggestions || []).forEach(s => {
      const li = document.createElement('li');
      li.textContent = s;
      list.appendChild(li);
    });
  } catch (e) {
    console.error('Score error:', e);
    $('feedbackText').textContent = '获取评分失败，请确保后端正在运行。';
  }
}

function closeScore() {
  $('scoreOverlay').classList.remove('show');
}

// ─── TTS 语音朗读 ───
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

async function speakText(text) {
  const btn = event?.target;
  if (btn) {
    btn.textContent = '🔊 播放中...';
    btn.disabled = true;
  }

  try {
    // 调用后端 TTS 生成音频
    const res = await fetch(`${API_BASE}/tts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error('TTS failed');
    const data = await res.json();

    // 通过 audio 元素播放
    const audio = new Audio(`http://127.0.0.1:3001${data.audio_url}`);
    audio.onended = () => {
      if (btn) {
        btn.textContent = '🔊 朗读';
        btn.disabled = false;
      }
    };
    audio.play().catch(e => {
      console.error('Playback error:', e);
      if (btn) {
        btn.textContent = '🔊 朗读';
        btn.disabled = false;
      }
    });
  } catch (e) {
    console.error('TTS error:', e);
    // 降级：浏览器原生语音合成
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
    if (btn) {
      btn.textContent = '🔊 朗读';
      btn.disabled = false;
    }
  }
}

// AI 回复后自动朗读（可开关）
let autoSpeak = true;
function toggleAutoSpeak() {
  autoSpeak = !autoSpeak;
  const btn = document.getElementById('autoSpeakBtn');
  if (btn) btn.textContent = autoSpeak ? '🔊 自动朗读' : '🔇 自动朗读关';
}

// ─── 语音输入 ───
let recognition = null;
let isListening = false;

function getSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  if (recognition) return recognition;

  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    let finalTranscript = '';
    let interimTranscript = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (result.isFinal) {
        finalTranscript += result[0].transcript + ' ';
      } else {
        interimTranscript += result[0].transcript;
      }
    }

    const input = $('chatInput');
    if (finalTranscript) {
      // 追加到输入框
      const current = input.value.trim();
      input.value = current ? current + ' ' + finalTranscript.trim() : finalTranscript.trim();
      input.focus();
      // 光标移到末尾
      input.selectionStart = input.selectionEnd = input.value.length;
    }
    if (interimTranscript) {
      input.placeholder = '🎤 ' + interimTranscript;
    }
  };

  recognition.onerror = (event) => {
    console.error('Speech recognition error:', event.error);
    stopListening();

    if (event.error === 'not-allowed') {
      showToast('请允许使用麦克风权限');
    } else if (event.error === 'no-speech') {
      showToast('未检测到语音，请重试');
    } else if (event.error === 'network') {
      // Chrome 需要网络连接来用语音识别
      showToast('语音识别需要网络连接');
    } else {
      showToast('语音识别出错: ' + event.error);
    }
  };

  recognition.onend = () => {
    // 如果还在 listening 状态但结束了，重新启动
    if (isListening) {
      try {
        recognition.start();
      } catch (e) {
        // ignore
      }
    }
  };

  return recognition;
}

function toggleVoiceInput() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showToast('您的浏览器不支持语音输入，请使用 Chrome 或 Edge');
    return;
  }

  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  const sr = getSpeechRecognition();
  if (!sr) {
    showToast('语音识别不可用');
    return;
  }

  isListening = true;
  const btn = $('micBtn');
  btn.classList.add('listening');
  btn.textContent = '⏹️';
  btn.title = '点击停止录音';
  $('voiceStatus').classList.add('show');
  $('chatInput').placeholder = '🎤 请用英语说话...';

  try {
    sr.start();
  } catch (e) {
    // 已经启动了，忽略
  }
}

function stopListening() {
  isListening = false;
  const btn = $('micBtn');
  btn.classList.remove('listening', 'processing');
  btn.textContent = '🎤';
  btn.title = '语音输入';
  $('voiceStatus').classList.remove('show');
  $('chatInput').placeholder = '用英语输入你想说的话...';

  if (recognition) {
    try {
      recognition.stop();
    } catch (e) {
      // ignore
    }
  }
}

// Toast 提示
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  toast.style.cssText = `
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:#1e293b;color:#f1f5f9;padding:12px 24px;
    border-radius:12px;font-size:13px;z-index:200;
    box-shadow:0 4px 20px rgba(0,0,0,0.3);
    animation:fadeIn 0.3s ease;
  `;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ─── 状态 ───
function setStatus(status) {
  const dot = $('statusDot');
  const text = $('statusText');
  if (status === 'connected') {
    dot.className = 'dot online';
    text.textContent = '已连接';
  } else if (status === 'error') {
    dot.className = 'dot offline';
    text.textContent = '连接失败 — 请启动后端';
  } else {
    dot.className = 'dot offline';
    text.textContent = status;
  }
}

// ─── 初始化 ───
loadScenarios();
